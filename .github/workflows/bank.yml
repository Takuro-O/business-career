name: 問題バンクの生成

on:
  schedule:
    - cron: '17 19 * * *'   # 毎日 日本時間 4:17（Googleの1日枠が戻った後）
  workflow_dispatch:
    inputs:
      models:
        description: '使うモデル（カンマ区切り。空ならアプリの既定）'
        required: false
        default: ''
      target:
        description: '目標問数'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save jsdom@24
      - name: 問題を生成（目標に届くまで毎日少しずつ追加）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ inputs.models }}
        run: node tools/generate-bank.mjs jinzai 3 ${{ inputs.target || 100 }}
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bank
          git diff --cached --quiet || (git commit -m "問題バンクを更新" && git push)
